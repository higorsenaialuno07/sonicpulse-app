<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </radialGradient>
    
    <!-- Neon Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#FF0033" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1E1E1E" stroke-width="8" />

  <!-- Equalizer / Pulse Audio Wave Waves -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="116" y="216" width="36" height="80" rx="18" fill="#00F0FF" />
    <!-- Bar 2 -->
    <rect x="180" y="136" width="36" height="240" rx="18" fill="url(#pulseGrad)" />
    <!-- Bar 3 (Center High) -->
    <rect x="244" y="86" width="36" height="340" rx="18" fill="url(#pulseGrad)" />
    <!-- Bar 4 -->
    <rect x="308" y="166" width="36" height="180" rx="18" fill="url(#pulseGrad)" />
    <!-- Bar 5 -->
    <rect x="372" y="236" width="36" height="40" rx="18" fill="#FF0033" />
  </g>
</svg>